; watchdog configuration. Copy to /etc/watchdog/watchdog.ini (root:watchdog, 640).
; Checks are not defined here: add them with `sudo watchdog tui`.

[server]
; Bind to localhost and publish through a TLS reverse proxy (see apache/nginx snippets).
listen = 127.0.0.1:8787
; The public base URL that monitored hosts use; shown as ping URLs in the TUI.
public_url = https://watchdog.example.com/watchdog
; Scheduler period in seconds.
tick = 15
; When a command runs as root it switches to this user so the database stays owned by it.
user = watchdog
; Events kept per check for history.
events_kept = 100

[database]
; SQLite file; the directory must be writable by the service user.
path = /var/lib/watchdog/watchdog.db

[pushover]
; KEY=VALUE file with pushover_token and pushover_user (any case).
env_file = /etc/watchdog/pushover.env
; Emergency (priority 2) alerts repeat every `retry` seconds until acknowledged or `expire`.
retry = 300
expire = 86400

[defaults]
; Pre-filled values for new checks in the TUI (seconds).
interval = 300
grace = 300
timeout = 10
failures_before_alert = 2
priority = 0
remind_after = 0
