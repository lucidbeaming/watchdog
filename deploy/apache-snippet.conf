# Add inside an existing TLS <VirtualHost *:443>. Requires mod_proxy and mod_proxy_http:
#   a2enmod proxy proxy_http && systemctl reload apache2
# Ping URLs become https://watchdog.example.com/watchdog/ping/<token>
ProxyPass        /watchdog/ http://127.0.0.1:8787/
ProxyPassReverse /watchdog/ http://127.0.0.1:8787/
